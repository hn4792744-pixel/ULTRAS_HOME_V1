name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # No gradlew is committed (this repo was authored in a sandbox without internet/Gradle to
          # generate the wrapper jar), so a specific Gradle version is installed and used directly.
          gradle-version: '9.6.0'

      - name: Build
        run: gradle build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ULTRAS_HOMES-1.1.0
          path: build/libs/ULTRAS_HOMES-1.1.0.jar
